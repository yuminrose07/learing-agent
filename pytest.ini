[pytest]
# ─── 测试发现 ──────────────────────────────────────────────
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# ─── asyncio ──────────────────────────────────────────────
# 项目大量使用 async；统一用 asyncio_mode=auto 避免每个测试加 @pytest.mark.asyncio
asyncio_mode = auto

# ─── 输出 ──────────────────────────────────────────────────
addopts =
    -ra
    --strict-markers
    --tb=short

# ─── Markers ──────────────────────────────────────────────
# 用法:
#   pytest -m unit              # 只跑 L1 单元
#   pytest -m "e2e and not slow"
#   pytest -m memory            # 只跑 memory 模块相关
#
# 层级 markers（FIRE 方法论中的 L1-L4）
markers =
    unit: L1 单元测试 - 单个函数/类，不涉及外部状态
    integration: L2 集成测试 - 模块之间的契约
    e2e: L3 端到端测试 - 完整用户场景，跑通 agent loop
    slow: L4 非功能测试 - 性能/长任务/压力，CI 默认跳过

    # 功能模块 markers（按 learning_agent/ 下子模块划分）
    agent: agent runtime 相关（agent_loop / react_engine / hook_system）
    ai: AI provider / file_store / mode_profile
    memory: memory_manager / knowledge_graph / spaced_repetition
    web: web_server / web 适配
    compaction: compaction 子系统
    session: session manager / session events / event store

    # 测试性质 markers
    live_llm: 需要真实 LLM 调用，默认跳过（用 --live-llm 启用）
    flaky: 已知偶发失败，单独跑
