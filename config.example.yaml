# Learning-Agent 配置文件示例
# 复制为 config.yaml 即可生效

# 数据存储目录
data_dir: "./learning_agent_data"

# 可观测性数据目录
observability_dir: "./observability"

# LLM Provider 配置
provider:
  type: openai
  model: kimi-2.6
  # api_key: sk-your-key-here
  # 建议通过环境变量 MOONSHOT_API_KEY 或 OPENAI_API_KEY 设置，避免将密钥写入文件
  base_url: https://api.moonshot.cn/v1
  timeout: 60.0
  max_retries: 3

# 知识确认设置
# true = 自动将候选知识晋升到长期记忆（无需手动确认）
auto_confirm_knowledge: false

# 日志级别: DEBUG | INFO | WARNING | ERROR
log_level: INFO

# ─── Tool Guard 权限配置（v2.0） ───
# 借鉴 Claude Code 权限系统设计，支持三级决策：allow / ask / deny
# ask = 暂停等待用户确认，而非直接拒绝
tool_guard:
  # bash 模式:
  #   disabled    - 完全禁止 bash（学习场景默认推荐）
  #   default     - 简单命令 allow，可疑模式 ask，危险命令 deny
  #   readonly    - 仅允许只读命令（ls, cat, grep, git log 等）
  #   allowlisted - 仅允许白名单中的命令前缀
  #   unrestricted- 完全开放（危险，谨慎使用）
  bash_mode: disabled

  # 旧版兼容：bash 命令白名单/黑名单（前缀匹配）
  # bash_allowlist:
  #   - "ls"
  #   - "git"
  # bash_denylist:
  #   - "rm -rf /"

  # 新版规则系统（优先级高于模式）：
  # 规则格式: "tool_name:rule_content"
  #   - 精确匹配: "bash:ls -la"
  #   - 前缀匹配: "bash:git:*"  （匹配 "git log", "git status" 等）
  #   - 通配符匹配: "bash:ls *"  （* 匹配任意字符序列）
  # rules:
  #   allow:
  #     - "bash:ls *"
  #     - "bash:cat *"
  #     - "bash:git log:*"
  #     - "file:read:*"
  #   deny:
  #     - "bash:sudo *"
  #     - "bash:rm -rf /"
  #     - "file:write:.env"
  #   ask:
  #     - "bash:git push *"
  #     - "file:write:.gitconfig"

# ─── Web Search 外部知识检索配置 ───
# 内置 provider 使用轻量 HTML 搜索与正文抓取，适合学习场景 Agent 的外部资料发现。
web_search:
  enabled: true
  provider: builtin
  default_top_k: 5
  max_top_k: 10
  default_limit_chars: 12000
  timeout_seconds: 12
  allowed_source_types:
    - official_docs
    - official_blog
    - github_repo
    - github_issue
    - community_forum
    - blog
    - paper
    - news
    - aggregator
