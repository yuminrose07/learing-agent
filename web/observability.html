<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Learning-Agent · 会话事件</title>
    <style>
        :root {
            --bg: #f8fafc;
            --panel: #ffffff;
            --border: #e2e8f0;
            --text: #1e293b;
            --muted: #64748b;
            --accent: #2563eb;
            --accent-soft: #eef2ff;
            --danger: #b91c1c;
            --danger-soft: #fef2f2;
            --vis-agent: #2563eb;
            --vis-system: #64748b;
            --vis-ui: #0891b2;
            --vis-observability: #ea580c;
        }
        * { box-sizing: border-box; }
        html, body { height: 100%; margin: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.5;
        }
        #app {
            display: grid;
            grid-template-columns: 280px 1fr;
            height: 100vh;
        }
        /* Sidebar */
        aside.sidebar {
            background: var(--panel);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            min-width: 0;
        }
        .sidebar-header {
            padding: 16px 18px;
            border-bottom: 1px solid var(--border);
        }
        .sidebar-header h1 {
            font-size: 14px;
            margin: 0;
            font-weight: 600;
            color: var(--text);
        }
        .sidebar-header a {
            font-size: 12px;
            color: var(--muted);
            text-decoration: none;
            display: inline-block;
            margin-top: 6px;
        }
        .sidebar-header a:hover { color: var(--accent); }
        .session-list {
            flex: 1;
            overflow-y: auto;
            padding: 8px;
        }
        .session-row {
            padding: 10px 12px;
            border-radius: 8px;
            cursor: pointer;
            margin-bottom: 2px;
            font-size: 13px;
            color: var(--text);
            border: 1px solid transparent;
            transition: background 0.1s ease, border-color 0.1s ease;
        }
        .session-row:hover { background: var(--accent-soft); }
        .session-row.active {
            background: var(--accent-soft);
            border-color: var(--accent);
            color: var(--accent);
            font-weight: 500;
        }
        .session-row .session-id {
            font-family: ui-monospace, monospace;
            font-size: 12px;
        }
        .session-row .session-title {
            color: var(--muted);
            font-size: 11px;
            margin-top: 2px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .session-empty {
            padding: 20px;
            text-align: center;
            color: var(--muted);
            font-size: 13px;
        }
        /* Main */
        main.main {
            display: flex;
            flex-direction: column;
            min-width: 0;
        }
        .toolbar {
            padding: 14px 22px;
            border-bottom: 1px solid var(--border);
            background: var(--panel);
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: center;
        }
        .toolbar .session-label {
            font-weight: 600;
            color: var(--text);
            font-family: ui-monospace, monospace;
            font-size: 13px;
        }
        .toolbar .toolbar-stats {
            color: var(--muted);
            font-size: 12px;
        }
        .toolbar .toolbar-actions {
            margin-left: auto;
            display: flex;
            gap: 8px;
            align-items: center;
        }
        .toolbar button {
            background: var(--panel);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
        }
        .toolbar button:hover { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
        .filter-row {
            padding: 10px 22px;
            border-bottom: 1px solid var(--border);
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
            background: var(--panel);
            font-size: 12px;
            color: var(--muted);
        }
        .vis-chip {
            display: inline-flex;
            align-items: center;
            padding: 4px 10px;
            border-radius: 999px;
            font-size: 11px;
            font-weight: 600;
            border: 1px solid;
            cursor: pointer;
            user-select: none;
        }
        .vis-chip.off { opacity: 0.35; }
        .vis-chip[data-vis="agent"]         { color: var(--vis-agent);         border-color: color-mix(in srgb, var(--vis-agent) 35%, white);         background: color-mix(in srgb, var(--vis-agent) 10%, white); }
        .vis-chip[data-vis="system"]        { color: var(--vis-system);        border-color: color-mix(in srgb, var(--vis-system) 35%, white);        background: color-mix(in srgb, var(--vis-system) 10%, white); }
        .vis-chip[data-vis="ui"]            { color: var(--vis-ui);            border-color: color-mix(in srgb, var(--vis-ui) 35%, white);            background: color-mix(in srgb, var(--vis-ui) 10%, white); }
        .vis-chip[data-vis="observability"] { color: var(--vis-observability); border-color: color-mix(in srgb, var(--vis-observability) 35%, white); background: color-mix(in srgb, var(--vis-observability) 10%, white); }
        .type-input {
            flex: 1;
            min-width: 200px;
            max-width: 360px;
            padding: 6px 10px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 12px;
            font-family: ui-monospace, monospace;
            color: var(--text);
        }
        .type-input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
        /* Timeline */
        .timeline {
            flex: 1;
            overflow-y: auto;
            padding: 16px 22px;
        }
        .timeline .empty {
            text-align: center;
            color: var(--muted);
            padding: 40px;
        }
        .event-row {
            background: var(--panel);
            border-left: 3px solid var(--border);
            border-radius: 0 8px 8px 0;
            padding: 8px 14px;
            margin-bottom: 4px;
            transition: background 0.1s ease;
        }
        .event-row.is-failure {
            background: var(--danger-soft);
            border-left-color: #ef4444;
        }
        .event-row.is-failure summary .event-type { color: var(--danger); font-weight: 700; }
        .event-row[data-target="true"] {
            border-left-color: var(--accent);
            box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 20%, transparent);
        }
        .event-row summary {
            cursor: pointer;
            list-style: none;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
            font-size: 13px;
        }
        .event-row summary::-webkit-details-marker { display: none; }
        .event-row summary::before {
            content: '▸';
            color: var(--muted);
            font-size: 10px;
            margin-right: 2px;
        }
        .event-row[open] summary::before { content: '▾'; }
        .event-row .seq {
            font-family: ui-monospace, monospace;
            font-weight: 700;
            color: var(--muted);
            min-width: 42px;
        }
        .event-row .ts {
            color: var(--muted);
            font-family: ui-monospace, monospace;
            font-size: 12px;
        }
        .event-row .event-type {
            color: var(--text);
            font-family: ui-monospace, monospace;
            font-weight: 500;
        }
        .parent-link {
            font-size: 12px;
            color: var(--muted);
            margin-left: 4px;
        }
        .parent-link a { color: var(--accent); text-decoration: none; }
        .parent-link a:hover { text-decoration: underline; }
        .parent-link.parent-hidden {
            color: var(--muted);
            font-style: italic;
            opacity: 0.7;
        }
        .parent-link.parent-missing { color: var(--danger); }
        .event-body {
            margin-top: 10px;
            padding: 10px 12px;
            background: var(--bg);
            border-radius: 6px;
            border: 1px solid var(--border);
        }
        .event-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            font-size: 11px;
            color: var(--muted);
            margin-bottom: 8px;
        }
        .event-meta code {
            background: var(--accent-soft);
            padding: 1px 6px;
            border-radius: 4px;
            font-family: ui-monospace, monospace;
        }
        .payload {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 10px;
            font-family: ui-monospace, monospace;
            font-size: 12px;
            line-height: 1.45;
            white-space: pre-wrap;
            word-break: break-word;
            max-height: 480px;
            overflow: auto;
            margin: 0;
        }
        .toast {
            position: fixed;
            bottom: 24px;
            right: 24px;
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 10px 16px;
            font-size: 13px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.08);
            z-index: 9999;
            transition: opacity 0.3s;
        }
    </style>
</head>
<body>
    <div id="app">
        <aside class="sidebar">
            <div class="sidebar-header">
                <h1>📜 会话事件</h1>
                <a href="index.html">← 返回聊天</a>
            </div>
            <div id="session-list" class="session-list">
                <div class="session-empty">加载中…</div>
            </div>
        </aside>

        <main class="main">
            <div class="toolbar">
                <span class="session-label" id="current-session">未选择会话</span>
                <span class="toolbar-stats" id="stats-text"></span>
                <div class="toolbar-actions">
                    <button id="btn-refresh" type="button">↻ 刷新</button>
                </div>
            </div>
            <div class="filter-row">
                <span>visibility:</span>
                <span class="vis-chip" data-vis="agent">agent</span>
                <span class="vis-chip" data-vis="system">system</span>
                <span class="vis-chip" data-vis="observability">observability</span>
                <span class="vis-chip" data-vis="ui">ui</span>
                <span style="margin-left:12px">type 子串:</span>
                <input id="type-filter" class="type-input" type="text" placeholder="例：tool.exec 或 message" />
            </div>
            <div id="timeline" class="timeline">
                <div class="empty">从左侧选择一个会话以查看事件时间线</div>
            </div>
        </main>
    </div>

    <script src="static/observability.js"></script>
</body>
</html>
